[build]
builder = "nixpacks"

[deploy]
startCommand = "node --max-old-space-size=384 node_modules/.bin/next start"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# ─────────────────────────────────────────────────────────────────────────────
# ENV VARS — set these in the Railway dashboard, not here.
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED
#   VAULT_PASSWORD   Password for the vault UI (HTTP Basic Auth).
#   HMAC_KEY         openssl rand -hex 32 — makes password comparison
#                    constant-time. Required in production.
#
# NOT required once R2 is configured: the catalog lives in the bucket beside the
# images, so there is no volume to mount and nothing on disk to lose.
#
# RECOMMENDED — turns on Cloudflare R2 (free egress, global CDN)
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET
#   R2_PUBLIC_BASE       e.g. https://img.yourdomain.com  (no trailing slash)
#
# OPTIONAL
#   VAULT_STAFF_PASSWORD
#                    A second password that opens the delivery-proof section
#                    read-only. Staff can search and view every capture but
#                    cannot delete one or manage the team, so it is safe to
#                    hand to everyone. Unset = the role does not exist.
#   CAPTURE_RETENTION_DAYS
#                    Days a capture is kept before it is destroyed (default 90).
#   DATA_DIR         Only used when R2 is NOT configured. Point at a mounted
#   UPLOAD_DIR       Volume (/data and /data/uploads) or everything is wiped on
#                    every redeploy.
#   PUBLIC_HOST      Your custom domain, e.g. vault.yourdomain.com — needed so
#                    server actions accept requests from it.
