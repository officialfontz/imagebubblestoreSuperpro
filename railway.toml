[build]
builder = "nixpacks"

[deploy]
startCommand = "node --max-old-space-size=384 node_modules/.bin/next start"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# ─────────────────────────────────────────────────────────────────────────────
# ENV VARS — set these in the Railway dashboard, not here.
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED
#   VAULT_PASSWORD   Password for the vault UI (HTTP Basic Auth).
#   HMAC_KEY         openssl rand -hex 32 — makes password comparison
#                    constant-time. Required in production.
#   DATA_DIR         Mount a Railway Volume here (e.g. /data) and point this at
#                    it. vault.json lives here; without a volume your whole
#                    catalog is wiped on every redeploy.
#
# RECOMMENDED — turns on Cloudflare R2 (free egress, global CDN)
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET
#   R2_PUBLIC_BASE       e.g. https://img.yourdomain.com  (no trailing slash)
#
# OPTIONAL
#   UPLOAD_DIR       Only used when R2 is NOT configured. Point at the volume
#                    too (e.g. /data/uploads) or local images die on redeploy.
#   PUBLIC_HOST      Your custom domain, e.g. vault.yourdomain.com — needed so
#                    server actions accept requests from it.
